[project]
name = "scribe-iq-backend"
version = "0.1.0"
description = "Scribe-IQ FastAPI backend (clinical RAG demo)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.0",
  "openai>=1.35.0",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "psycopg2-binary>=2.9.9",
  "httpx>=0.27.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0"]

[project.scripts]
scribe-load-corpus = "scripts.load_corpus:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
