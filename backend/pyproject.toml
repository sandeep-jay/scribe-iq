[project]
name = "scribe-iq-backend"
version = "0.1.0"
description = "Scribe-IQ FastAPI backend (clinical RAG demo)"
readme = "README.md"
license = { text = "Portfolio/Educational Use Only - see repository LICENSE" }
authors = [{ name = "Sandeep Jayaprakash" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.0",
  "structlog>=24.1.0",
  "openai>=1.35.0",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "psycopg2-binary>=2.9.9",
  "httpx>=0.27.0",
  "boto3>=1.34.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "tox>=4.15.0",
]

[project.scripts]
scribe-load-corpus = "scripts.load_corpus:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: tests that require a live Postgres database",
]
filterwarnings = [
  "error::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "I001", "E402", "B905"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
