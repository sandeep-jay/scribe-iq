[tox]
envlist = lint, py311
isolated_build = true

[testenv]
description = Run backend pytest suite
extras = dev
commands =
    pytest

[testenv:py311]
description = Run tests on Python 3.11
basepython = python3.11
extras = dev
commands =
    pytest

[testenv:lint]
description = Run ruff lint checks
extras = dev
commands =
    ruff check app tests scripts

[testenv:all]
description = Run lint then tests
extras = dev
commands =
    ruff check app tests scripts
    pytest
