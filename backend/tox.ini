[tox]
envlist = lint, py311
isolated_build = true

[testenv]
extras = dev

[testenv:lint]
description = Run ruff lint checks
commands =
    ruff check app tests scripts

[testenv:unit]
description = Run fast unit/contract tests with coverage gate
commands =
    pytest -m "not integration" --cov=app.responsible_ai.safety_checks --cov=app.responsible_ai.dashboard_derived --cov=app.middleware.optional_api_key --cov-report=term-missing --cov-fail-under=80

[testenv:integration]
description = Run tests requiring live Postgres
passenv = TEST_DATABASE_URL DATABASE_URL
commands =
    pytest -m integration

[testenv:py311]
description = Run unit coverage gate plus integration tests
basepython = python3.11
commands =
    {[testenv:unit]commands}
    {[testenv:integration]commands}
